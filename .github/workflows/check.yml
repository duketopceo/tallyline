name: check

# Hosted runners: this repo is public. pull_request (never pull_request_target)
# so fork PRs run with a read-only token and no secrets.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  TURBO_TELEMETRY_DISABLED: "1"
  DO_NOT_TRACK: "1"

jobs:
  static:
    name: typecheck, lint, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - name: Privacy scan (no personal hosts, paths or names in a public repo)
        env:
          # newline-separated terms; a secret so the terms never land in the repo.
          # Fork PRs get no secrets and run the generic rules only.
          PRIVACY_DENYLIST: ${{ secrets.PRIVACY_DENYLIST }}
        run: bash tools/ci/privacy-scan.sh
      - name: Workflow lint
        run: |
          v=1.7.12
          curl -fsSL -o /tmp/al.tgz "https://github.com/rhysd/actionlint/releases/download/v$v/actionlint_${v}_linux_amd64.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  /tmp/al.tgz" | sha256sum -c -
          tar -xzf /tmp/al.tgz -C /tmp actionlint
          /tmp/actionlint -color
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run typecheck lint
      - run: pnpm turbo run build
      - name: Silver Lining design gates
        run: |
          pnpm lint:design
          pnpm test:contrast
          pnpm test:token-parity
      - name: Deploy script tests
        run: bash ops/deploy.test.sh
      - name: Installer tests
        run: bash tools/install/install.test.sh
      - name: Plugin and marketplace manifests
        run: |
          npm install --global @anthropic-ai/claude-code@2.1.296
          claude plugin validate . --strict
          claude plugin validate ./plugins/tallyline --strict
          cmp SKILL.md plugins/tallyline/skills/tallyline/SKILL.md
      - name: Package contents (npm pack dry run)
        run: |
          for d in apps/mcp-server tools/cli; do
            (cd "$d" && npm pack --dry-run)
          done

  unit:
    name: unit tests (postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tallyline_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tallyline_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    # test harnesses refuse to run unless DATABASE_URL is explicit and
    # not the default dev stack (apps/api/test/db-guard.ts); the db names below
    # are deliberately not `tallyline`
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tallyline_test
      JWT_SECRET: ci-only-not-a-secret-0123456789abcdef
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # serial: the api suites share one database
      - run: pnpm turbo run test --filter='!@tallyline/e2e' --concurrency=1

  e2e:
    name: e2e (playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tallyline_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tallyline_e2e"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tallyline_e2e
      JWT_SECRET: ci-only-not-a-secret-0123456789abcdef
      E2E_API_PORT: "4000"
      E2E_WEB_PORT: "3100"
      NEXT_PUBLIC_API_URL: http://localhost:4000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # the API (started by tools/e2e via tsx) loads the built mcp-server library
      - run: pnpm turbo run build --filter=@tallyline/web... --filter=@tallyline/mcp-server...
      - run: node scripts/bundle-budget.mjs
        working-directory: tools/e2e
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: tools/e2e
      - run: pnpm test:e2e
        working-directory: tools/e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-results
          path: tools/e2e/test-results
          if-no-files-found: ignore
          retention-days: 7

  security:
    name: dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: pnpm audit --prod --audit-level=high
      - if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
