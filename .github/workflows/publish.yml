name: publish

# Publishes @tallyline/mcp-server and @tallyline/cli to npm with provenance
# when a v* tag is pushed. Needs one-time owner setup (npm scope + trusted
# publishing or NPM_TOKEN); see docs/releasing.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    # the mcp-server tests boot the API harness, which refuses to run without an
    # explicit non-dev DATABASE_URL (apps/api/test/db-guard.ts), same as check.yml
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tallyline_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tallyline_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tallyline_test
    permissions:
      contents: read
      id-token: write # npm provenance / trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Throwaway JWT secret for the test harness
        run: echo "JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - name: Tag must match package versions
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for d in apps/mcp-server tools/cli; do
            v=$(node -p "require('./$d/package.json').version")
            [ "$v" = "$tag" ] || { echo "$d is $v, tag is $tag"; exit 1; }
          done
      - run: pnpm turbo run build typecheck lint
      - run: pnpm turbo run test --filter=@tallyline/mcp-server --filter=@tallyline/cli --concurrency=1
      - name: Publish
        run: |
          for d in apps/mcp-server tools/cli; do
            (cd "$d" && npm publish --provenance --access public)
          done
        env:
          # Unset when using npm trusted publishing (OIDC); set the secret
          # only if falling back to a token.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
