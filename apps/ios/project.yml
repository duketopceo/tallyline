name: Tallyline
options:
  bundleIdPrefix: app.tallyline
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

packages:
  TallylineIOS:
    path: .

targets:
  Tallyline:
    type: application
    platform: iOS
    sources:
      - AppTarget
      - path: Resources/Assets.xcassets
      - path: Resources/PrivacyInfo.xcprivacy
    dependencies:
      - package: TallylineIOS
        product: tallyline_ios
      - target: TallylineWidgets
    settings:
      base:
        PRODUCT_NAME: Tallyline
        PRODUCT_BUNDLE_IDENTIFIER: app.tallyline.ios
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_FILE: build/Info.xcode.plist  # generated by scripts/xcode-plist.sh from Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: App.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: YES
        SUPPORTS_MACCATALYST: NO
        SWIFT_VERSION: "6.0"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
      configs:
        Release:
          SWIFT_OPTIMIZATION_LEVEL: -O
    entitlements:
      path: App.entitlements
      # XcodeGen rewrites this file from `properties` on every generate; keep them here.
      properties:
        # Push: the App ID needs the Push Notifications capability (docs/push.md).
        aps-environment: development
        # Shared with the widget extension; the App Group must exist on both App IDs.
        com.apple.security.application-groups:
          - group.app.tallyline.ios

  TallylineWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Extensions/Widgets
        excludes:
          - Info.plist
    dependencies:
      - package: TallylineIOS
        product: TallylineKit
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_NAME: TallylineWidgets
        PRODUCT_BUNDLE_IDENTIFIER: app.tallyline.ios.widgets
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_FILE: Extensions/Widgets/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Extensions/Widgets/Widgets.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "6.0"
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
    entitlements:
      path: Extensions/Widgets/Widgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.app.tallyline.ios

  TallylineUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
