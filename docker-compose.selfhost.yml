# tallyline self-host stack — `docker compose -f docker-compose.selfhost.yml up -d`
# builds the app from source and gives you a working board at :3100.
# postgres stays on the internal network; only web (and optionally
# api) are published.
#
# Production hosts deploy through ops/deploy.sh, which sets GIT_SHA so every image
# carries org.opencontainers.image.revision (see docs/deploy.md).

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:-tallyline}
    volumes:
      - tallyline-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      labels:
        org.opencontainers.image.revision: ${GIT_SHA:-unknown}
    environment:
      NODE_ENV: production
      API_PORT: "4000"
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-tallyline}
      JWT_SECRET: ${JWT_SECRET:?}
      API_BASE_URL: ${API_BASE_URL:-http://localhost:4000}
      RATE_LIMIT_PER_MIN: ${RATE_LIMIT_PER_MIN:-600}
      RATE_LIMIT_ANON_PER_MIN: ${RATE_LIMIT_ANON_PER_MIN:-120}
      RATE_LIMIT_AUTH_PER_MIN: ${RATE_LIMIT_AUTH_PER_MIN:-30}
      TALLYLINE_ALLOW_WORKSPACE_CREATE: ${TALLYLINE_ALLOW_WORKSPACE_CREATE:-}
      TALLYLINE_WEBHOOK_ALLOW_PRIVATE: ${TALLYLINE_WEBHOOK_ALLOW_PRIVATE:-}
      WEB_URL: ${WEB_URL:-http://localhost:3100}
      TRUSTED_PROXY: ${TRUSTED_PROXY:-}
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:-}
      AUTH_ADMIN_EMAILS: ${AUTH_ADMIN_EMAILS:-}
      AUTH_DISABLE_PASSWORD: ${AUTH_DISABLE_PASSWORD:-}
      AUTH_ACCOUNT_LINKING: ${AUTH_ACCOUNT_LINKING:-}
      AUTH_ALLOWED_EMAIL_DOMAINS: ${AUTH_ALLOWED_EMAIL_DOMAINS:-}
      AUTH_AUTO_JOIN_SINGLE_WORKSPACE: ${AUTH_AUTO_JOIN_SINGLE_WORKSPACE:-}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_SLUG: ${GITHUB_APP_SLUG:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_DISPLAY_NAME: ${OIDC_DISPLAY_NAME:-}
      OIDC_SCOPES: ${OIDC_SCOPES:-email profile}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET:-}
      SLACK_APP_TOKEN: ${SLACK_APP_TOKEN:-}
      SLACK_WORKSPACE_SLUG: ${SLACK_WORKSPACE_SLUG:-}
      SLACK_INTAKE_EMOJI: ${SLACK_INTAKE_EMOJI:-ticket}
      TALLYLINE_LLM_API_KEY: ${TALLYLINE_LLM_API_KEY:-}
      TALLYLINE_LLM_BASE_URL: ${TALLYLINE_LLM_BASE_URL:-https://openrouter.ai/api/v1}
      TALLYLINE_LLM_MODEL: ${TALLYLINE_LLM_MODEL:-google/gemini-2.5-flash-lite}
    ports:
      - "${API_PUBLISH_PORT:-4000}:4000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      labels:
        org.opencontainers.image.revision: ${GIT_SHA:-unknown}
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    environment:
      NODE_ENV: production
      # server-side bridge routes hit the API over the internal network
      API_INTERNAL_URL: http://api:4000
    ports:
      - "${WEB_PUBLISH_PORT:-3100}:3100"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://localhost:3100/').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  # optional hosted-MCP endpoint — `docker compose ... --profile mcp up -d`
  # passthrough mode: each request carries Authorization + x-tallyline-workspace
  mcp-server:
    profiles: ["mcp"]
    build:
      context: .
      dockerfile: apps/mcp-server/Dockerfile
      labels:
        org.opencontainers.image.revision: ${GIT_SHA:-unknown}
    environment:
      NODE_ENV: production
      TALLYLINE_API_URL: ${TALLYLINE_MCP_API_URL:-http://api:4000}
      # set both for single-tenant mode; leave unset for header passthrough
      TALLYLINE_TOKEN: ${TALLYLINE_TOKEN:-}
      TALLYLINE_WORKSPACE: ${TALLYLINE_WORKSPACE:-}
      TALLYLINE_ALLOW_API_URL_OVERRIDE: ${TALLYLINE_ALLOW_API_URL_OVERRIDE:-}
    ports:
      - "${MCP_PUBLISH_PORT:-3101}:3101"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://localhost:3101/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

volumes:
  tallyline-postgres:
    # pinned physical name — survives compose-project/dir renames
    name: tallyline-postgres
